# Hyprsunset nightlight configuration
# Auto-switches between day and night color temperatures

max-gamma = 150

# Daytime profile - normal colors at 6 AM
profile {
  time = 6:00
  identity = true
  gamma = 1.0
}

# Evening profile - warm at 6 PM
profile {
  time = 18:00
  temperature = 4500
  gamma = 0.9
}

# Late night profile - very warm at 10 PM
profile {
  time = 22:00
  temperature = 3500
  gamma = 0.85
}
