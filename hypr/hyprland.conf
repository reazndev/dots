################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto
monitor=HDMI-A-1,5120x1440@165.00Hz,0x0,1.25

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty --gtk-single-instance=false
$fileManager = dolphin
$menu = hyprlauncher

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

# #############################
# ### SOURCES #################
# #############################

source = /home/reazn/.config/hypr/colors.conf
source = /home/reazn/.config/hypr/env.conf
source = /home/reazn/.config/hypr/startup.conf
source = /home/reazn/.config/hypr/general.conf
source = /home/reazn/.config/hypr/decorations.conf
source = /home/reazn/.config/hypr/animations.conf
source = /home/reazn/.config/hypr/misc.conf
source = /home/reazn/.config/hypr/rules.conf
source = /home/reazn/.config/hypr/keybinds.conf
