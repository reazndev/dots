# Starship config template generated by Wallust

format = """
$directory$git_branch$git_status
$character"""

add_newline = false

[directory]
style = "bold #9BA296"
format = "[$path]($style)"
truncation_length = 0
truncate_to_repo = false

[git_branch]
style = "bold #F5F2BB"
format = " [ $branch]($style)"

[git_status]
format = " $ahead_behind$staged$modified$untracked$deleted$renamed$stashed"
ahead = "[↑$count](bold #5B605A)"
behind = "[↓$count](bold #462A26)"
diverged = "[↑$ahead_count↓$behind_count](bold #462A26)"
staged = "[\\[$count staged\\]](bold #5B605A)"
modified = "[\\[~$count\\]](bold #ECA747)"
untracked = "[\\[?$count\\]](bold #A37662)"
deleted = "[\\[✗$count\\]](bold #462A26)"
renamed = "[\\[»$count\\]](bold #A37662)"
stashed = "[\\[≡$count stashed\\]](bold #9BA296)"
ignore_submodules = true

[character]
success_symbol = "[↪](bold #5B605A)"
error_symbol = "[↪](bold #462A26)"
vicmd_symbol = "[↪](bold #9BA296)"
