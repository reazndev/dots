# Starship config template generated by Wallust

format = """
$directory$git_branch$git_status
$character"""

add_newline = false

[directory]
style = "bold #C58D3C"
format = "[$path]($style)"
truncation_length = 0
truncate_to_repo = false

[git_branch]
style = "bold #F7F3D5"
format = " [ $branch]($style)"

[git_status]
format = " $ahead_behind$staged$modified$untracked$deleted$renamed$stashed"
ahead = "[↑$count](bold #61731E)"
behind = "[↓$count](bold #2F2332)"
diverged = "[↑$ahead_count↓$behind_count](bold #2F2332)"
staged = "[\\[$count staged\\]](bold #61731E)"
modified = "[\\[~$count\\]](bold #FDCACD)"
untracked = "[\\[?$count\\]](bold #806D6A)"
deleted = "[\\[✗$count\\]](bold #2F2332)"
renamed = "[\\[»$count\\]](bold #806D6A)"
stashed = "[\\[≡$count stashed\\]](bold #C58D3C)"
ignore_submodules = true

[character]
success_symbol = "[↪](bold #61731E)"
error_symbol = "[↪](bold #2F2332)"
vicmd_symbol = "[↪](bold #C58D3C)"
