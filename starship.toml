# Starship config template generated by Wallust

format = """
$directory$git_branch$git_status
$character"""

add_newline = false

[directory]
style = "bold #80717D"
format = "[$path]($style)"
truncation_length = 0
truncate_to_repo = false

[git_branch]
style = "bold #B89292"
format = " [ $branch]($style)"

[git_status]
format = " $ahead_behind$staged$modified$untracked$deleted$renamed$stashed"
ahead = "[↑$count](bold #4F4950)"
behind = "[↓$count](bold #00354D)"
diverged = "[↑$ahead_count↓$behind_count](bold #00354D)"
staged = "[\\[$count staged\\]](bold #4F4950)"
modified = "[\\[~$count\\]](bold #79899B)"
untracked = "[\\[?$count\\]](bold #45637F)"
deleted = "[\\[✗$count\\]](bold #00354D)"
renamed = "[\\[»$count\\]](bold #45637F)"
stashed = "[\\[≡$count stashed\\]](bold #80717D)"
ignore_submodules = true

[character]
success_symbol = "[↪](bold #4F4950)"
error_symbol = "[↪](bold #00354D)"
vicmd_symbol = "[↪](bold #80717D)"
