##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}


layerrule {
    name = vicinae-blur
    blur = on
    ignore_alpha = 0
    match:namespace = vicinae
}

layerrule {
    name = quickshell-blur
    blur = on
    ignore_alpha = 0
    match:namespace = quickshell
}
##############################
### WORKSPACE ASSIGNMENTS  ###
##############################

# Workspace 1: Editors & IDEs
windowrule = workspace silent 1, match:class zeditor|zed|zed-preview|zed-editor|code|code-oss|vscodium|codium|vscode|vs-code|vsc
windowrule = workspace silent 1, match:class jetbrains-.*|android-studio

# Workspace 2: Browsers
windowrule = workspace silent 2, match:class helium-browser|helium-preview|helium|net\.imput\.helium|zen-browser|zen|zen-alpha|firefox|librewolf|chromium

# Workspace 3: Terminals
windowrule = workspace silent 3, match:class ghostty|ghostty-preview|com\.mitchellh\.ghostty|foot|Alacritty|kitty

# Workspace 4: Office
windowrule = workspace silent 4, match:class libreoffice|soffice|soffice\.bin

##############################
###  SPECIAL WORKSPACES    ###
##############################

# Messenger scratchpad (toggle with mainMod + d)
windowrule = workspace special:messenger, match:class vesktop|element-desktop|Element|im\.riot\.Riot|discord|Discord|webcord|WebCord

# Music scratchpad (toggle with mainMod + g)
windowrule = workspace special:music, match:class spotify|Spotify|spicetify|feishin|app\.feishin\.Feishin|ncspotify
