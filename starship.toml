# Starship config template generated by Wallust

# Set up format
format = """
$directory\
$git_branch\
$git_status\
$character"""

[directory]
style = "bold #9BA296"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold #ECA747"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold #A37662"
format = "[\\[$all_status$ahead_behind\\]]($style) "

[character]
success_symbol = "[➜](bold #5B605A) "
error_symbol = "[➜](bold #462A26) "
